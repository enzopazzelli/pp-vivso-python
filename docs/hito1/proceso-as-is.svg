<svg width="100%" viewBox="0 0 720 820" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Proceso de gestión de vivienda social</title>
<desc>Flujo del proceso de vivienda social de la Subsecretaría de Promoción Humana de Santiago del Estero. Versión con conexiones ordenadas sin cruces sobre nodos.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="360" y="28" text-anchor="middle" style="fill:#141413;font-family:'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;font-weight:500">Proceso de gestión de vivienda social</text>
<text x="360" y="46" text-anchor="middle" style="fill:#3D3D3A;font-family:'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px">Subsecretaría de Promoción Humana — Santiago del Estero</text>

<!-- ═══════════════════════════════════════════════════
     FILA 1 — Inicio → Orientación → Verificación
     ═══════════════════════════════════════════════════ -->

<g>
<rect x="50" y="80" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="101" text-anchor="middle" dominant-baseline="central" style="fill:#085041;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">1. Inicio</text>
<text x="140" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56;font-family:'Anthropic Sans',sans-serif;font-size:12px">Institución se acerca</text>
</g>
<line x1="230" y1="108" x2="268" y2="108" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>

<g>
<rect x="270" y="80" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="360" y="101" text-anchor="middle" dominant-baseline="central" style="fill:#085041;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">2. Orientación</text>
<text x="360" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56;font-family:'Anthropic Sans',sans-serif;font-size:12px">Requisitos y procedimientos</text>
</g>
<line x1="450" y1="108" x2="488" y2="108" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>

<g>
<rect x="490" y="80" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="580" y="101" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">3. Verificación</text>
<text x="580" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7;font-family:'Anthropic Sans',sans-serif;font-size:12px">¿Cumple requisitos?</text>
</g>

<!-- Conector U: Verificación → Registro GEDO (baja por la derecha, cruza por arriba y baja por izquierda) -->
<path d="M580 136 L580 170 L140 170 L140 200" fill="none" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5"/>
<text x="588" y="156" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Sí</text>

<!-- ═══════════════════════════════════════════════════
     FILA 2 — Registro GEDO → Relevamiento → Carga VISOC
     ═══════════════════════════════════════════════════ -->

<g>
<rect x="50" y="202" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="223" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">4. Registro GEDO</text>
<text x="140" y="242" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7;font-family:'Anthropic Sans',sans-serif;font-size:12px">Apertura del expediente</text>
</g>
<line x1="230" y1="230" x2="268" y2="230" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>

<g>
<rect x="270" y="202" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="360" y="223" text-anchor="middle" dominant-baseline="central" style="fill:#085041;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">5. Relevamiento</text>
<text x="360" y="242" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56;font-family:'Anthropic Sans',sans-serif;font-size:12px">App GPS — datos en campo</text>
</g>
<line x1="450" y1="230" x2="488" y2="230" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>

<g>
<rect x="490" y="202" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="580" y="223" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">6. Carga VISOC</text>
<text x="580" y="242" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7;font-family:'Anthropic Sans',sans-serif;font-size:12px">Aplicación local</text>
</g>

<!-- ═══════════════════════════════════════════════════
     PUNTO CRÍTICO — entre Relevamiento y Carga VISOC
     ═══════════════════════════════════════════════════ -->

<g>
<rect x="220" y="294" width="370" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="405" y="313" text-anchor="middle" dominant-baseline="central" style="fill:#633806;font-family:'Anthropic Sans',sans-serif;font-size:13px;font-weight:500">⚠ Punto crítico — Doble carga de datos</text>
<text x="405" y="330" text-anchor="middle" dominant-baseline="central" style="fill:#854F0B;font-family:'Anthropic Sans',sans-serif;font-size:11px">App GPS y VISOC desconectados (10–30 min/expediente)</text>
</g>

<!-- líneas punteadas conectando el punto crítico a los nodos involucrados -->
<line x1="360" y1="258" x2="360" y2="294" stroke="#BA7517" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<line x1="540" y1="258" x2="540" y2="294" stroke="#BA7517" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

<!-- Conector U: Carga VISOC → Adjunto en GEDO (baja desde la derecha, esquiva el punto crítico) -->
<path d="M670 230 L700 230 L700 380 L670 380" fill="none" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5"/>

<!-- ═══════════════════════════════════════════════════
     FILA 3 — Evaluación ← Adjunto en GEDO
     ═══════════════════════════════════════════════════ -->

<g>
<rect x="490" y="362" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="580" y="383" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">7. Adjunto en GEDO</text>
<text x="580" y="402" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7;font-family:'Anthropic Sans',sans-serif;font-size:12px">PDF de VISOC al expediente</text>
</g>

<!-- flecha Adjunto en GEDO → Evaluación (horizontal limpia) -->
<line x1="488" y1="390" x2="232" y2="390" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>

<g>
<rect x="50" y="362" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="140" y="383" text-anchor="middle" dominant-baseline="central" style="fill:#712B13;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">8. Evaluación</text>
<text x="140" y="402" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D;font-family:'Anthropic Sans',sans-serif;font-size:12px">¿Proyecto aprobado?</text>
</g>

<!-- ═══════════════════════════════════════════════════
     FILA 4 — Ejecución / Archivo (ramas)
     ═══════════════════════════════════════════════════ -->

<!-- rama Sí (vertical hacia abajo) -->
<line x1="140" y1="418" x2="140" y2="452" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>
<text x="148" y="440" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Sí</text>

<!-- rama No (al archivo) — sale por el borde inferior del rombo, separada de la flecha entrante -->
<path d="M200 418 L200 436 L340 436 L340 452" fill="none" marker-end="url(#arrow)" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="208" y="432" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">No</text>

<g>
<rect x="50" y="454" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="140" y="475" text-anchor="middle" dominant-baseline="central" style="fill:#712B13;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">9. Ejecución</text>
<text x="140" y="494" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D;font-family:'Anthropic Sans',sans-serif;font-size:12px">Fondos y construcción</text>
</g>

<g>
<rect x="250" y="454" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="475" text-anchor="middle" dominant-baseline="central" style="fill:#444441;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">Archivo del expediente</text>
<text x="340" y="494" text-anchor="middle" dominant-baseline="central" style="fill:#5F5E5A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Proyecto no aprobado</text>
</g>

<!-- Ejecución → Seguimiento (vertical hacia abajo, alineado) -->
<line x1="140" y1="510" x2="140" y2="544" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>

<!-- ═══════════════════════════════════════════════════
     FILA 5 — Seguimiento → Entrega
     ═══════════════════════════════════════════════════ -->

<g>
<rect x="50" y="546" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="140" y="567" text-anchor="middle" dominant-baseline="central" style="fill:#712B13;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">10. Seguimiento</text>
<text x="140" y="586" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D;font-family:'Anthropic Sans',sans-serif;font-size:12px">Monitoreo y verificación</text>
</g>

<line x1="230" y1="574" x2="268" y2="574" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>

<g>
<rect x="270" y="546" width="180" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="360" y="567" text-anchor="middle" dominant-baseline="central" style="fill:#27500A;font-family:'Anthropic Sans',sans-serif;font-size:14px;font-weight:500">11. Entrega</text>
<text x="360" y="586" text-anchor="middle" dominant-baseline="central" style="fill:#3B6D11;font-family:'Anthropic Sans',sans-serif;font-size:12px">Vivienda terminada</text>
</g>

<!-- ═══════════════════════════════════════════════════
     Leyenda
     ═══════════════════════════════════════════════════ -->

<rect x="50" y="650" width="620" height="120" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="66" y="672" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px;font-weight:500">Referencias</text>

<!-- columna 1 -->
<rect x="66" y="686" width="12" height="12" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="86" y="696" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Inicio y relevamiento</text>

<rect x="66" y="710" width="12" height="12" rx="2" fill="#CECBF6" stroke="#3C3489" stroke-width="0.5"/>
<text x="86" y="720" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Documentación y registro</text>

<rect x="66" y="734" width="12" height="12" rx="2" fill="#F5C4B3" stroke="#712B13" stroke-width="0.5"/>
<text x="86" y="744" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Ejecución y cierre</text>

<!-- columna 2 -->
<rect x="270" y="686" width="12" height="12" rx="2" fill="#C0DD97" stroke="#27500A" stroke-width="0.5"/>
<text x="290" y="696" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Resultado final</text>

<rect x="270" y="710" width="12" height="12" rx="2" fill="#E5E4DF" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="290" y="720" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Ramificación alternativa</text>

<rect x="270" y="734" width="12" height="12" rx="2" fill="#FAC775" stroke="#633806" stroke-width="0.5"/>
<text x="290" y="744" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Punto crítico (oportunidad de mejora)</text>

<!-- columna 3 — referencia visual de conectores -->
<line x1="490" y1="692" x2="520" y2="692" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>
<text x="528" y="696" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Flujo principal</text>

<line x1="490" y1="716" x2="520" y2="716" stroke="#BA7517" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<text x="528" y="720" style="fill:#3D3D3A;font-family:'Anthropic Sans',sans-serif;font-size:12px">Asociación con punto crítico</text>

</svg>
